<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AquaAgri | AquaAgri Pathfinder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        /* Real Colorful Clownfish Cursor */
        cursor: url("https://cdn-icons-png.flaticon.com/32/2970/2970068.png") 16 16, auto;
      }
      
      /* Pointer Cursor */
      a, button, [role="button"], input, select, textarea {
        cursor: url("https://cdn-icons-png.flaticon.com/32/2970/2970068.png") 16 16, pointer;
      }

      /* Cursor Bubble Effect */
      .cursor-bubble {
        position: fixed;
        width: 8px;
        height: 8px;
        /* Blue Bubble */
        background: radial-gradient(circle at 30% 30%, rgba(135, 206, 250, 0.9), rgba(30, 144, 255, 0.4));
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        animation: riseAndFade 1.5s ease-out forwards;
        box-shadow: 0 0 4px rgba(30, 144, 255, 0.6);
        border: 1px solid rgba(135, 206, 250, 0.5);
      }

      @keyframes riseAndFade {
        0% {
          transform: translateY(0) scale(0.5);
          opacity: 0.8;
        }
        100% {
          transform: translateY(-80px) scale(1.5);
          opacity: 0;
        }
      }

      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #ea580c; /* Orange to match theme */
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #c2410c;
      }

      /* Animations */
      /* Fish moves Right to Left (needs flip to face Left) */
      @keyframes swimLeft {
        0% { transform: translateX(100vw) translateY(0) scaleX(-1) rotate(0deg); opacity: 0; }
        10% { opacity: 0.8; }
        25% { transform: translateX(75vw) translateY(40px) scaleX(-1) rotate(5deg); }
        50% { transform: translateX(50vw) translateY(-30px) scaleX(-1) rotate(-5deg); }
        75% { transform: translateX(25vw) translateY(20px) scaleX(-1) rotate(3deg); }
        90% { opacity: 0.8; }
        100% { transform: translateX(-300px) translateY(0) scaleX(-1) rotate(0deg); opacity: 0; }
      }

      /* Fish moves Left to Right (faces Right by default) */
      @keyframes swimRight {
        0% { transform: translateX(-300px) translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.8; }
        50% { transform: translateX(50vw) translateY(-50px) rotate(0deg); }
        100% { transform: translateX(100vw) translateY(0) rotate(0deg); opacity: 0; }
      }

      @keyframes floatBubble {
        0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
        20% { opacity: 0.5; }
        50% { transform: translateY(50vh) scale(1); opacity: 0.8; }
        80% { opacity: 0.5; }
        100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
      }

      @keyframes finWave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(15deg); }
      }

      .fish-swim-left {
        animation: swimLeft 35s linear infinite;
      }
      .fish-swim-right {
        animation: swimRight 40s linear infinite;
      }
      
      .fish-fin {
        transform-origin: center;
        animation: finWave 1s ease-in-out infinite;
      }

      .bubble-rise {
        animation: floatBubble 8s ease-in infinite;
      }
      
      /* Scroll Reveal Classes */
      .reveal {
        opacity: 0;
        transform: translateY(30px);
        transition: all 0.8s ease-out;
      }
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script>
      // Create Bubble Effect on Mouse Move
      document.addEventListener('mousemove', function(e) {
        // Throttle bubble creation
        if (Math.random() > 0.1) return; // 10% chance per move event to create a bubble

        const bubble = document.createElement('div');
        bubble.classList.add('cursor-bubble');
        
        // Randomize position slightly around cursor
        const offsetX = (Math.random() - 0.5) * 10;
        const offsetY = (Math.random() - 0.5) * 10;
        
        bubble.style.left = (e.clientX + offsetX) + 'px';
        bubble.style.top = (e.clientY + offsetY) + 'px';
        
        // Random size
        const size = Math.random() * 8 + 4; // 4px to 12px
        bubble.style.width = size + 'px';
        bubble.style.height = size + 'px';

        document.body.appendChild(bubble);

        // Remove bubble after animation
        setTimeout(() => {
          bubble.remove();
        }, 1500);
      });
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
